<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>SRE Swarm AI Dashboard</title>
    <style>
        body { font-family: sans-serif; background: #0b0f19; color: #e2e8f0; padding: 24px; max-width: 800px; margin: 0 auto; }
        h1 { color: #38bdf8; }
        label { display: block; margin: 12px 0 4px; font-weight: bold; font-size: 14px; }
        select, textarea { width: 100%; background: #1e293b; border: 1px solid #334155; color: white; border-radius: 6px; padding: 10px; font-family: monospace; }
        button { background: #10b981; color: #022c22; font-weight: bold; border: none; padding: 12px; width: 100%; border-radius: 6px; cursor: pointer; margin-top: 16px; font-size: 16px; }
        button:hover { background: #34d399; }
        button:disabled { opacity: 0.5; }
        .box { background: #111827; border: 1px solid #1f2937; padding: 16px; border-radius: 8px; margin-top: 20px; display: none; }
        pre { background: #030712; padding: 12px; border-radius: 6px; overflow-x: auto; color: #6ee7b7; font-size: 13px; white-space: pre-wrap; }
    </style>
</head>
<body>

    <h1>🛡️ SRE Swarm AI</h1>
    <p style="color: #94a3b8;">Autonomous Incident Resolver with Vector Memory</p>

    <label>Language</label>
    <select id="lang">
        <option value="python">Python</option>
        <option value="javascript">JavaScript</option>
        <option value="go">Go</option>
    </select>

    <label>Broken Code</label>
    <textarea id="code" rows="5">def calculate_average_order(orders):
    total_amount = sum(order['amount'] for order in orders)
    return total_amount / len(orders)

print(calculate_average_order([]))</textarea>

    <label>Error Log</label>
    <textarea id="error" rows="2">ZeroDivisionError: division by zero in calculate_average_order at line 3</textarea>

    <button id="btn" onclick="runFix()">🚀 Auto-Heal & Verify Code</button>

    <div id="result" class="box">
        <h3>Status: <span id="status" style="color:#10b981;"></span></h3>
        <label>Root Cause Analysis (RCA):</label>
        <pre id="rca" style="color: #cbd5e1;"></pre>
        <label>Verified Fixed Code:</label>
        <pre id="patch"></pre>
        <label>Sandbox Output:</label>
        <pre id="sandbox" style="color: #94a3b8;"></pre>
    </div>

    <script>
        async function runFix() {
            const btn = document.getElementById('btn');
            const box = document.getElementById('result');
            
            btn.innerText = "⏳ Swarm is fixing & testing in sandbox...";
            btn.disabled = true;
            box.style.display = "none";

            const payload = {
                language: document.getElementById('lang').value,
                broken_code: document.getElementById('code').value,
                error_log: document.getElementById('error').value
            };

            try {
                const response = await fetch('/triage/', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                if (!response.ok) {
                    throw new Error("Server error: " + response.status);
                }

                const data = await response.json();
                document.getElementById('status').innerText = data.status;
                document.getElementById('rca').innerText = data.rca_post_mortem;
                document.getElementById('patch').innerText = data.verified_code_patch;
                document.getElementById('sandbox').innerText = data.sandbox_execution_output;
                box.style.display = "block";
            } catch (err) {
                alert("Error: " + err.message);
            } finally {
                btn.innerText = "🚀 Auto-Heal & Verify Code";
                btn.disabled = false;
            }
        }
    </script>
</body>
</html>
